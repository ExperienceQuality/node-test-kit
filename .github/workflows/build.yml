# hub-stage: build
name: Build

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    uses: ExperienceQuality/.github/.github/workflows/node-library-build.yml@v1
    with:
      node-version: '24'
      package-manager: npm
      working-directory: .
