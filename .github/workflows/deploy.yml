# hub-stage: deploy
name: Node release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.route.outputs.version }}
    steps:
      - id: route
        name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ "$REF_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag: $REF_NAME" >&2
            exit 1
          fi

  build:
    needs: route
    uses: ./.github/workflows/build.yml

  test:
    needs: [route, build]
    uses: ./.github/workflows/test.yml

  publish:
    needs: [route, build, test]
    uses: ./.github/workflows/publish.yml
    secrets: inherit

  release:
    needs: [route, build, test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.route.outputs.version }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "@xq/test platform release ${VERSION}; published packages: @xq/rest-client, @xq/db, @xq/stub, @xq/core, @xq/test."
