# hub-stage: deploy
name: Node release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: node-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  route:
    runs-on: ubuntu-latest
    outputs:
      ref: ${{ steps.route.outputs.ref }}
      version: ${{ steps.route.outputs.version }}
    steps:
      - id: route
        name: Validate release tag
        env:
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          TAG_NAME="$REF_NAME"
          if [[ -n "$RELEASE_TAG" ]]; then TAG_NAME="$RELEASE_TAG"; fi
          if [[ "$TAG_NAME" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "ref=$TAG_NAME" >> "$GITHUB_OUTPUT"
            echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          else
            echo "Unsupported release tag: $REF_NAME" >&2
            exit 1
          fi

  build:
    needs: route
    uses: ./.github/workflows/build.yml
    with:
      ref: ${{ needs.route.outputs.ref }}

  test:
    needs: [route, build]
    uses: ./.github/workflows/test.yml
    with:
      ref: ${{ needs.route.outputs.ref }}

  publish:
    needs: [route, build, test]
    uses: ./.github/workflows/publish.yml
    with:
      ref: ${{ needs.route.outputs.ref }}
    permissions:
      contents: read
      packages: write

  release:
    needs: [route, build, test, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ needs.route.outputs.ref }}
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.route.outputs.version }}
          TAG_NAME: ${{ needs.route.outputs.ref }}
        run: |
          gh release create "$TAG_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --notes "@xq/test platform release ${VERSION}; published to the company GitHub Packages npm registry."
