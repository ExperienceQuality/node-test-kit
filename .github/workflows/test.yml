# hub-stage: test
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type-check workspaces
        run: npm run check
      - name: Run unit and integration tests
        run: npm test
      - name: Run backend functional E2E tests
        run: npm run test:e2e
      - name: Verify packed-package consumer
        run: npm run verify:packages
