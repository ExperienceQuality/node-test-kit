# hub-stage: test
name: Test

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    uses: ExperienceQuality/.github/.github/workflows/node-library-test.yml@v1
    with:
      node-version: '24'
      package-manager: npm
      working-directory: .
